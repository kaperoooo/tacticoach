[tool.poetry]
name = "tacticoach"
version = "0.1.0"
description = "TactiCoach tactical football platform"
authors = ["kaperoooo <kaperoooo@users.noreply.github.com>"]
readme = "README.md"
license = "MIT"

[tool.poetry.dependencies]
python = ">=3.12,<4.0"
fastapi = "^0.115.0"
uvicorn = "^0.30.6"
sqlalchemy = "^2.0.34"
pydantic = "^2.8.2"
python-dotenv = "^1.0.1"
httpx = "^0.27.2"
python-multipart = "^0.0.9"

[tool.poetry.group.dev.dependencies]
pytest = "^8.8.2"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"
